<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💱 환율 변환기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <header class="header">
            <h1>💱 실시간 환율 변환기</h1>
            <p class="subtitle">실시간 환율로 통화를 변환해보세요</p>
        </header>

        <!-- 변환 카드 -->
        <div class="converter-card">
            <!-- 금액 입력 -->
            <div class="amount-section">
                <label for="amount">금액</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="0"
                    value="1"
                    min="0"
                    step="0.01"
                >
            </div>

            <!-- From 통화 -->
            <div class="currency-section">
                <label>From</label>
                <div class="currency-select-wrapper">
                    <select id="fromCurrency" class="currency-select">
                        <option value="USD" selected>🇺🇸 USD - 미국 달러</option>
                        <option value="KRW">🇰🇷 KRW - 한국 원</option>
                        <option value="EUR">🇪🇺 EUR - 유로</option>
                        <option value="JPY">🇯🇵 JPY - 일본 엔</option>
                        <option value="CNY">🇨🇳 CNY - 중국 위안</option>
                        <option value="GBP">🇬🇧 GBP - 영국 파운드</option>
                        <option value="AUD">🇦🇺 AUD - 호주 달러</option>
                        <option value="CAD">🇨🇦 CAD - 캐나다 달러</option>
                        <option value="CHF">🇨🇭 CHF - 스위스 프랑</option>
                        <option value="HKD">🇭🇰 HKD - 홍콩 달러</option>
                    </select>
                </div>
            </div>

            <!-- 스왑 버튼 -->
            <div class="swap-section">
                <button id="swapBtn" class="swap-btn" title="통화 교환">
                    🔄
                </button>
            </div>

            <!-- To 통화 -->
            <div class="currency-section">
                <label>To</label>
                <div class="currency-select-wrapper">
                    <select id="toCurrency" class="currency-select">
                        <option value="USD">🇺🇸 USD - 미국 달러</option>
                        <option value="KRW" selected>🇰🇷 KRW - 한국 원</option>
                        <option value="EUR">🇪🇺 EUR - 유로</option>
                        <option value="JPY">🇯🇵 JPY - 일본 엔</option>
                        <option value="CNY">🇨🇳 CNY - 중국 위안</option>
                        <option value="GBP">🇬🇧 GBP - 영국 파운드</option>
                        <option value="AUD">🇦🇺 AUD - 호주 달러</option>
                        <option value="CAD">🇨🇦 CAD - 캐나다 달러</option>
                        <option value="CHF">🇨🇭 CHF - 스위스 프랑</option>
                        <option value="HKD">🇭🇰 HKD - 홍콩 달러</option>
                    </select>
                </div>
            </div>

            <!-- 변환 버튼 -->
            <button id="convertBtn" class="convert-btn">
                변환하기
            </button>

            <!-- 결과 표시 -->
            <div id="result" class="result hidden">
                <div class="result-amount">
                    <span id="fromAmount"></span>
                    <span id="fromCurrencyText"></span>
                </div>
                <div class="equals">=</div>
                <div class="result-amount highlight">
                    <span id="toAmount"></span>
                    <span id="toCurrencyText"></span>
                </div>
                <div class="exchange-rate">
                    <span id="rateInfo"></span>
                </div>
            </div>

            <!-- 로딩 상태 -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>환율 정보를 가져오는 중...</p>
            </div>

            <!-- 에러 메시지 -->
            <div id="error" class="error hidden">
                <p id="errorMessage"></p>
            </div>
        </div>

        <!-- 즐겨찾기 통화 쌍 -->
        <div class="favorites-section">
            <h3>⭐ 빠른 변환</h3>
            <div class="favorite-pairs">
                <button class="favorite-btn" data-from="USD" data-to="KRW">
                    USD → KRW
                </button>
                <button class="favorite-btn" data-from="EUR" data-to="KRW">
                    EUR → KRW
                </button>
                <button class="favorite-btn" data-from="JPY" data-to="KRW">
                    JPY → KRW
                </button>
                <button class="favorite-btn" data-from="CNY" data-to="KRW">
                    CNY → KRW
                </button>
            </div>
        </div>

        <!-- 최근 변환 기록 -->
        <div class="history-section">
            <div class="history-header">
                <h3>📊 최근 변환 기록</h3>
                <button id="clearHistoryBtn" class="clear-history-btn">
                    기록 삭제
                </button>
            </div>
            <div id="historyList" class="history-list">
                <p class="no-history">아직 변환 기록이 없습니다</p>
            </div>
        </div>

        <!-- 업데이트 시간 -->
        <footer class="footer">
            <p id="lastUpdate">환율 정보를 불러오는 중...</p>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
