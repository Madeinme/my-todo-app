<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 나의 할 일 목록</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <header class="header">
            <h1>📝 나의 할 일 목록</h1>
            <p class="subtitle">오늘 할 일을 관리해보세요!</p>
        </header>

        <!-- 입력 영역 -->
        <div class="input-section">
            <div class="input-container">
                <input
                    type="text"
                    id="todoInput"
                    placeholder="할 일을 입력하세요..."
                    maxlength="100"
                >
                <select id="prioritySelect" class="priority-select">
                    <option value="low">낮음</option>
                    <option value="medium" selected>보통</option>
                    <option value="high">높음</option>
                </select>
                <button id="addBtn" class="add-btn">추가</button>
            </div>
        </div>

        <!-- 통계 -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">전체:</span>
                <span id="totalCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">완료:</span>
                <span id="completedCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">진행중:</span>
                <span id="activeCount" class="stat-value">0</span>
            </div>
        </div>

        <!-- 필터 버튼 -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <!-- 할 일 목록 -->
        <div class="todo-container">
            <ul id="todoList" class="todo-list"></ul>

            <!-- 빈 상태 메시지 -->
            <div id="emptyState" class="empty-state">
                <p>📭 할 일이 없습니다!</p>
                <p>위에서 새로운 할 일을 추가해보세요.</p>
            </div>
        </div>

        <!-- 하단 버튼 -->
        <div class="bottom-actions">
            <button id="clearCompletedBtn" class="clear-btn">
                완료된 항목 삭제
            </button>
            <button id="clearAllBtn" class="clear-btn danger">
                전체 삭제
            </button>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
