<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글이 깨지지 않도록 UTF-8 인코딩 사용 -->
    <meta charset="UTF-8">
    <!-- 모바일 화면 너비에 맞춰 표시 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시되는 제목 -->
    <title>홍길동 | 자기소개</title>
    <!-- 디자인(색상, 배치 등)을 담당하는 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 화면 가운데에 놓이는 프로필 카드 -->
    <main class="card">
        <!-- 프로필 아바타 (장식용이라 스크린리더에서는 읽지 않음) -->
        <div class="avatar" aria-hidden="true">👤</div>
        <!-- 이름 -->
        <h1 class="name">홍길동</h1>
        <!-- 직업 -->
        <p class="job">프론트엔드 개발자</p>

        <!-- 취미 목록 (각 항목은 둥근 태그 모양으로 표시됨) -->
        <section class="hobbies">
            <h2>취미</h2>
            <ul>
                <li>영화 감상</li>
                <li>코딩</li>
                <li>여행</li>
            </ul>
        </section>
    </main>

    <!-- 동작(JavaScript)을 담당하는 파일. 페이지 내용을 다 읽은 뒤 불러오도록 body 맨 끝에 둠 -->
    <script src="main.js"></script>
</body>
</html>
