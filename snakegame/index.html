<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스네이크 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1 class="title">SNAKE GAME</h1>

        <!-- 점수판: 현재 점수와 최고 점수 -->
        <div class="scoreboard">
            <div class="score-box">
                <span class="score-label">점수</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">최고 점수</span>
                <span id="best-score" class="score-value">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">레벨</span>
                <span id="level" class="score-value">1</span>
            </div>
        </div>

        <!-- 조작 영역: 난이도 선택(게임 중에는 잠김)과 일시정지 버튼 -->
        <div class="controls">
            <label class="difficulty">
                <span class="score-label">난이도</span>
                <select id="difficulty">
                    <option value="200">쉬움</option>
                    <option value="150" selected>보통</option>
                    <option value="100">어려움</option>
                    <option value="50">매우 어려움</option>
                </select>
            </label>
            <button id="pause-btn" class="btn btn-sub" type="button" disabled>일시정지</button>
        </div>

        <!-- 게임 화면: 캔버스 위에 시작/게임 오버 안내를 겹쳐 표시 -->
        <div class="board">
            <canvas id="game" width="400" height="400"></canvas>

            <div id="overlay" class="overlay">
                <p id="overlay-title" class="overlay-title">스네이크 게임</p>
                <p id="overlay-text" class="overlay-text">방향키로 뱀을 조종하세요</p>
                <button id="start-btn" class="btn" type="button">게임 시작</button>
            </div>
        </div>

        <p class="help">← ↑ → ↓ 방향키로 이동 · 먹이 하나에 +10점 · 50점마다 레벨 업</p>
    </main>

    <script src="main.js"></script>
</body>
</html>
